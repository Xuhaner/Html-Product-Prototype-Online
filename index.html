<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#0e1729;
    --ink-2:#5b6577;
    --ink-3:#939db0;
    --line:#e6eaf3;
    --line-2:#d8dfec;
    --brand:#1677ff;
    --brand-ink:#0b5fd0;
    --brand-soft:#eef4ff;
    --r-lg:20px;
    --sh-1:0 1px 2px rgba(16,24,40,.04), 0 6px 20px -12px rgba(16,24,40,.14);
    --sh-2:0 26px 60px -26px rgba(16,24,40,.30), 0 8px 24px -16px rgba(16,24,40,.16);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 520px at 50% -200px, #e6f0ff 0%, rgba(230,240,255,0) 72%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  mark{background:#fff0a8; color:inherit; border-radius:3px; padding:0 2px}

  /* ---------------- 顶栏 ---------------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(255,255,255,.78);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{
    max-width:1140px; margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none}
  .brand svg{display:block; flex:0 0 auto}
  .brand-name{font-weight:650; font-size:15.5px; letter-spacing:-.01em}
  .brand-sub{
    color:var(--ink-3); font-size:13px; padding-left:12px;
    border-left:1px solid var(--line-2);
  }
  .stat{
    font-size:12.5px; color:var(--ink-2); background:#fff;
    border:1px solid var(--line); border-radius:999px; padding:6px 13px;
    white-space:nowrap;
  }

  /* ---------------- 主体 ---------------- */
  .wrap{max-width:1140px; margin:0 auto; padding:58px 28px 20px}
  .hero h1{
    margin:0 0 14px; font-size:42px; line-height:1.12;
    letter-spacing:-.028em; font-weight:700;
  }
  .hero p{
    margin:0; max-width:740px;
    color:var(--ink-2); font-size:16px; line-height:1.72;
  }

  /* ---------------- 搜索 ---------------- */
  .toolbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin:34px 0 22px;
  }
  .search{position:relative; flex:1 1 260px; max-width:420px}
  .search .ico{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--ink-3); pointer-events:none;
  }
  .search input{
    width:100%; padding:12px 42px 12px 40px;
    border:1px solid var(--line-2); border-radius:12px; background:#fff;
    font:inherit; font-size:14.5px; color:var(--ink); outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{border-color:var(--brand); box-shadow:0 0 0 4px rgba(22,119,255,.12)}
  .search input::-webkit-search-cancel-button{display:none}
  .search-clear{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; padding:0; border:0; border-radius:50%;
    background:#eef1f7; color:var(--ink-2);
    display:grid; place-items:center; cursor:pointer;
    transition:background .18s, color .18s;
  }
  .search-clear:hover{background:#e2e7f1; color:var(--ink)}
  .search-clear[hidden]{display:none}
  .result-count{font-size:13px; color:var(--ink-3); white-space:nowrap}
  .result-count b{color:var(--brand); font-weight:650}

  /* ---------------- 卡片 ---------------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:22px}

  .card{
    position:relative; display:flex; flex-direction:column;
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--r-lg); overflow:hidden;
    box-shadow:var(--sh-1);
    transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s, border-color .28s;
  }
  .card:hover{transform:translateY(-5px); box-shadow:var(--sh-2); border-color:#c9dcff}
  .card[hidden]{display:none}
  .card-main{position:absolute; inset:0; z-index:1; border-radius:inherit}

  .thumb{
    position:relative; aspect-ratio:16/10;
    display:flex; flex-direction:column;
    background:linear-gradient(135deg, var(--a-soft) 0%, #eef2f9 100%);
    border-bottom:1px solid var(--line);
  }
  .thumb-chrome{
    flex:0 0 30px; display:flex; align-items:center; gap:6px;
    padding:0 12px; background:#fff; border-bottom:1px solid var(--line);
  }
  .thumb-chrome i{width:8px; height:8px; border-radius:50%; background:#e3e7ef; display:block}
  .thumb-chrome u{
    margin-left:8px; height:13px; flex:1; max-width:170px;
    border-radius:7px; background:#f1f4f9; text-decoration:none;
  }
  .thumb-view{position:relative; flex:1; overflow:hidden}
  .thumb-view iframe{
    position:absolute; border:0; background:#fff;
    pointer-events:none; transform-origin:0 0;
  }
  .thumb-cta{
    position:absolute; inset:30px 0 0; z-index:2;
    display:grid; place-items:center; pointer-events:none;
    background:linear-gradient(180deg, rgba(14,23,41,0), rgba(14,23,41,.07));
    opacity:0; transition:opacity .25s;
  }
  .card:hover .thumb-cta{opacity:1}
  .thumb-cta span{
    background:rgba(255,255,255,.97); border:1px solid var(--line-2);
    color:var(--brand); font-size:13.5px; font-weight:600;
    padding:9px 18px; border-radius:999px; box-shadow:var(--sh-1);
  }

  .card-body{
    display:flex; flex-direction:column; gap:12px; flex:1;
    padding:18px 20px 20px;
  }
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  .card-head h3{margin:0; font-size:17.5px; font-weight:650; letter-spacing:-.012em; line-height:1.35}
  .badge{
    flex:0 0 auto; font-size:11.5px; font-weight:600; white-space:nowrap;
    color:var(--a); background:var(--a-soft);
    border-radius:999px; padding:4px 10px;
  }
  .desc{margin:0; font-size:13.5px; line-height:1.68; color:var(--ink-2)}
  .tags{display:flex; gap:7px; flex-wrap:wrap}
  .tag{
    font-size:12px; color:var(--ink-2);
    background:#f6f8fc; border:1px solid var(--line);
    border-radius:7px; padding:3px 9px;
  }
  .pages{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-top:auto; padding-top:14px; border-top:1px dashed var(--line);
  }
  .page-link{
    position:relative; z-index:3;
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:550; text-decoration:none;
    color:var(--brand); background:var(--brand-soft);
    border-radius:8px; padding:7px 12px;
    transition:background .18s;
  }
  .page-link:hover{background:#dfeaff}
  .page-link::after{content:"↗"; font-size:11px; opacity:.65}

  .empty{
    margin:64px 0; text-align:center;
    color:var(--ink-3); font-size:14px; line-height:1.9;
  }
  .empty b{display:block; color:var(--ink-2); font-size:15px; font-weight:600; margin-bottom:4px}

  /* ---------------- 页脚 ---------------- */
  .foot{
    max-width:1140px; margin:0 auto; padding:44px 28px 56px;
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    color:var(--ink-3); font-size:12.5px;
  }

  @media (max-width:760px){
    .topbar-in{padding:12px 20px}
    .brand-sub{display:none}
    .wrap{padding:38px 20px 12px}
    .hero h1{font-size:30px}
    .hero p{font-size:15px}
    .search{max-width:none}
    .grid{grid-template-columns:1fr; gap:18px}
    .foot{padding:34px 20px 44px}
  }
</style>

<script>
/* =========================================================================
   原型清单
   -------------------------------------------------------------------------
   新增原型：往下面的数组里加一条即可，卡片、统计、搜索都会自动更新。
   {
     id:       唯一标识
     title:    原型名称
     desc:     一句话说明
     tags:     关键词标签（同时参与搜索匹配）
     a / aSoft: 卡片强调色（普通色 / 浅色底）
     pages:    该原型的页面，第一条用于生成卡片缩略图
               { label: 页面名, path: 相对路径, vw/vh: 缩略图渲染视口 }
   }
   ========================================================================= */
const PROTOTYPES = [
  {
    id: 'school-unbind',
    title: '学校解绑与切换',
    desc: '个人中心「我的学校」的解绑与切换流程，PC 端与移动端两套界面，覆盖绑定关系查看、切换学校、解绑确认等关键交互。',
    tags: ['个人中心', 'PC + 移动端', '解绑', '切换'],
    a: '#1677ff',
    aSoft: '#e8f1ff',
    pages: [
      { label: 'PC 端', path: '学校解绑与切换/index.html', vw: 1440, vh: 900 },
      { label: '移动端', path: '学校解绑与切换/mobile.html', vw: 414, vh: 860 }
    ]
  },
  {
    id: 'lesson-upload',
    title: '课时批量上传',
    desc: '课程计划下的课时管理，批量上传课时的完整链路：上传入口、类型选择、文件选择、上传列表与完成状态。',
    tags: ['课程计划', '批量上传', '课时', '文件上传'],
    a: '#7c5cff',
    aSoft: '#f0ecff',
    pages: [
      { label: '打开原型', path: '课时批量上传/index.html', vw: 1440, vh: 900 }
    ]
  }
];

/* ---------------- 基础工具 ---------------- */
const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const qEl = document.getElementById('q');
const qClear = document.getElementById('qClear');
const resultCount = document.getElementById('resultCount');

let query = '';

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pageLabel(pg, total){
  return total > 1 ? pg.label : '打开原型';
}
function normalize(s){
  return String(s).toLowerCase().replace(/\s+/g, ' ').trim();
}
/* 空格分词：每个关键词都命中才算匹配（如「学校 移动」） */
function terms(){
  return query ? query.split(' ').filter(Boolean) : [];
}
function searchText(p){
  return normalize([p.title, p.desc, ...p.tags, ...p.pages.map(x => x.label)].join(' '));
}
function hit(p){
  const t = terms();
  if(!t.length) return true;
  const hay = searchText(p);
  return t.every(k => hay.includes(k));
}
/* 把命中的关键词包成 <mark>，让搜索结果一眼可见 */
function hl(text){
  let out = esc(text);
  terms().forEach(k => {
    const safe = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if(!safe) return;
    out = out.replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
  });
  return out;
}

/* ---------------- 构建卡片（只跑一次，缩略图 iframe 不重复加载） ---------------- */
function build(){
  grid.innerHTML = PROTOTYPES.map(p => {
    const first = p.pages[0];
    const badge = p.pages.length > 1 ? `${p.pages.length} 个页面` : '单页原型';
    return `
    <article class="card" data-id="${esc(p.id)}" style="--a:${p.a};--a-soft:${p.aSoft}">
      <a class="card-main" href="${esc(first.path)}" target="_blank" rel="noopener"
         aria-label="打开原型：${esc(p.title)}"></a>

      <div class="thumb">
        <div class="thumb-chrome"><i></i><i></i><i></i><u></u></div>
        <div class="thumb-view">
          <iframe src="${esc(first.path)}" loading="lazy" tabindex="-1" aria-hidden="true"
                  data-vw="${first.vw}" data-vh="${first.vh}" title=""></iframe>
        </div>
        <div class="thumb-cta"><span>点击查看原型</span></div>
      </div>

      <div class="card-body">
        <div class="card-head">
          <h3 class="t-title">${esc(p.title)}</h3>
          <span class="badge">${esc(badge)}</span>
        </div>
        <p class="desc t-desc">${esc(p.desc)}</p>
        <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <div class="pages">
          ${p.pages.map(pg => `
            <a class="page-link" href="${esc(pg.path)}" target="_blank" rel="noopener">${esc(pageLabel(pg, p.pages.length))}</a>
          `).join('')}
        </div>
      </div>
    </article>`;
  }).join('');
  requestAnimationFrame(fitAll);
}

/* ---------------- 搜索过滤：只切换显隐，不重建 DOM ---------------- */
function apply(){
  const t = terms();
  let shown = 0;

  PROTOTYPES.forEach(p => {
    const el = grid.querySelector('.card[data-id="' + p.id + '"]');
    if(!el) return;
    const ok = hit(p);
    el.hidden = !ok;
    if(ok){
      shown++;
      el.querySelector('.t-title').innerHTML = hl(p.title);
      el.querySelector('.t-desc').innerHTML = hl(p.desc);
    }
  });

  emptyEl.hidden = shown > 0;
  qClear.hidden = qEl.value.length === 0;
  resultCount.innerHTML = t.length
    ? (shown ? `找到 <b>${shown}</b> 个原型` : '没有匹配的原型')
    : '';

  requestAnimationFrame(fitAll);
}

/* ---------------- 缩略图自适应缩放 ---------------- */
function fit(view){
  const f = view.querySelector('iframe');
  if(!f) return;
  const vw = +f.dataset.vw, vh = +f.dataset.vh;
  const cw = view.clientWidth, ch = view.clientHeight;
  if(!vw || !vh || !cw || !ch) return;
  const s = Math.min(cw / vw, ch / vh);
  f.style.width  = vw + 'px';
  f.style.height = vh + 'px';
  f.style.transform = `scale(${s})`;
  f.style.left = ((cw - vw * s) / 2) + 'px';
  f.style.top  = ((ch - vh * s) / 2) + 'px';
}

const ro = new ResizeObserver(entries => entries.forEach(e => fit(e.target)));

function fitAll(){
  grid.querySelectorAll('.thumb-view').forEach(v => {
    ro.observe(v);
    fit(v);
  });
}

/* ---------------- 搜索交互 ---------------- */
/* 中文输入法组合期间不过滤，否则会拿拼音去匹配，看起来像"搜索坏了" */
let composing = false;
function sync(){
  query = normalize(qEl.value);
  apply();
}

qEl.addEventListener('compositionstart', () => { composing = true; });
qEl.addEventListener('compositionend', () => { composing = false; sync(); });
qEl.addEventListener('input', () => { if(!composing) sync(); });
qEl.addEventListener('keydown', e => {
  if(e.key === 'Escape' && qEl.value){ qEl.value = ''; sync(); }
});
qClear.addEventListener('click', () => { qEl.value = ''; sync(); qEl.focus(); });

/* ---------------- 统计信息 ---------------- */
(function(){
  const pages = PROTOTYPES.reduce((n, p) => n + p.pages.length, 0);
  document.getElementById('stat').textContent = `${PROTOTYPES.length} 个原型 · ${pages} 个页面`;
  document.getElementById('footMeta').textContent = `共 ${PROTOTYPES.length} 个原型 / ${pages} 个页面`;
})();

build();
apply();
</script>
