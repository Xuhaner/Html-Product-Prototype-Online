<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>睿秀学城 · 管理端登录</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-login" data-page="login">
<header class="login-header"><a class="login-brand" href="../index.html"><span class="brand-mark">睿</span><strong>睿秀学城<small>管理中心</small></strong></a><a href="../index.html">返回学生端 ↗</a></header>
<main class="login-layout">
<section class="login-intro"><span class="login-eyebrow">RUIXIU · MANAGEMENT</span><h1>让教学更有序，<br>让管理更从容。</h1><p>连接课程、班级与平台服务，<br>在一个工作空间里，专注每一次成长。</p><div class="login-map" aria-hidden="true"><div class="login-map-center">睿秀学城<span>教学与管理</span></div><span class="login-map-node">▤ 课程教学</span><span class="login-map-node">◎ 班级协作</span><span class="login-map-node">⚙ 平台治理</span></div><small class="login-intro-foot">教师管理端 · 超级管理员</small></section>
<section class="login-card" aria-labelledby="login-title"><div class="login-card-heading"><span class="login-eyebrow">欢迎回来</span><h2 id="login-title">管理端登录</h2><p id="login-role-note">登录后进入教师教学工作台</p></div>
<label class="login-role-label" for="login-role">管理身份<select id="login-role"><option value="teacher">教师管理端</option><option value="super">超级管理员</option></select></label>
<div class="login-tabs" role="tablist" aria-label="登录方式"><button id="password-tab" type="button" role="tab" aria-selected="true" aria-controls="password-form" data-login-mode="password">密码登录</button><button id="sms-tab" type="button" role="tab" aria-selected="false" aria-controls="sms-form" tabindex="-1" data-login-mode="sms">验证码登录</button></div>
<form id="password-form" class="login-form" role="tabpanel" aria-labelledby="password-tab" novalidate="">
<label>用户名 / 手机号<input name="account" autocomplete="username" required="" maxlength="64" placeholder="请输入用户名或手机号"></label>
<label>密码<span class="login-password"><input name="password" type="password" autocomplete="current-password" required="" minlength="6" maxlength="64" placeholder="请输入密码"><button type="button" id="password-toggle" aria-label="显示密码">显示</button></span></label>
<p class="login-error" role="alert"></p><button class="login-submit" type="submit">登录管理端 →</button></form>
<form id="sms-form" class="login-form" role="tabpanel" aria-labelledby="sms-tab" hidden="" novalidate="">
<label>手机号<input name="phone" type="tel" inputmode="tel" autocomplete="tel" pattern="1[3-9][0-9]{9}" maxlength="11" required="" placeholder="请输入 11 位手机号"></label>
<label>验证码<span class="login-code"><input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required="" placeholder="请输入 6 位验证码"><button id="send-code" type="button">获取验证码</button></span></label>
<p id="code-status" class="login-code-status" role="status"></p><p class="login-error" role="alert"></p><button class="login-submit" type="submit">登录管理端 →</button></form>
<p class="login-unified">账号统一注册，管理权限由平台分配。</p><p class="login-demo">本地登录演示：密码不少于 6 位；验证码为 123456，不发送短信。管理身份选择仅用于原型体验。</p><p id="login-status" class="login-status" role="status"></p>
</section></main><footer class="login-footer">睿秀学城 · 教学与管理协同平台</footer>
<script src="js/shared/auth.js"></script><script src="js/pages/login.js"></script>
</body></html>
