<!DOCTYPE html><html lang="zh-CN"><head>
<base href="../../">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>睿秀学城 · 数字素养与安全</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="spoc-learn">
<div class="app">
  <div id="site-header"></div>
  <main class="shell" id="main" tabindex="-1">
    <section class="page active" aria-labelledby="spoc-learn-title">
      <div class="study-layout">
        <aside class="study-sidebar">
          <button class="btn small" data-go="spoc-detail" data-hash="#catalog">← 返回课程</button>
          <h2 style="margin-top:20px">数字素养与安全</h2>
          <div class="progress"><span id="spoc-progress"></span></div>
          <div class="course-outline" aria-label="完整课程目录">
            <div class="chapter">第一章 · 识别数字风险</div>
            <button class="lesson-btn" data-spoc-content="lesson-1-1">1.1 信息真假与可信来源</button>
            <button class="lesson-btn" data-spoc-content="lesson-1-2">1.2 网络诈骗与社交工程</button>
            <button class="lesson-btn" data-spoc-content="lesson-1-3">1.3 安全使用公共网络</button>
            <button class="lesson-btn" data-go="practice">章节练习 · 5 题</button>
            <button class="lesson-btn" data-go="test">数字安全小测</button>
            <div class="chapter">第二章 · 保护个人信息</div>
            <button class="lesson-btn" data-spoc-content="lesson-2-1">2.1 个人信息与隐私边界</button>
            <button class="lesson-btn" data-spoc-content="lesson-2-2">2.2 账号、密码与多因素认证</button>
            <button class="lesson-btn" data-spoc-content="lesson-2-3">2.3 负责任的数字参与</button>
            <div class="chapter">课程考试</div>
            <button class="lesson-btn" data-go="exam">结课考试 · 60 分钟</button>
          </div>
        </aside>
        <div class="study-main">
          <div class="study-head"><div><div class="eyebrow">数字素养与安全 · 视频课程</div><h1 id="spoc-learn-title"></h1></div><button class="btn small" id="complete-spoc-lesson">标记课时完成</button></div>
          <div id="spoc-learning-content"></div>
          <section class="tab-panel" id="spoc-learning-discussion"></section>
        </div>
      </div>
    </section>
    <section class="statebox" id="global-state" aria-live="polite" tabindex="-1"></section>
  </main>
  <div id="site-footer"></div>
</div>
<script src="js/shared/shell.js"></script>
<script src="js/shared/core.js"></script>
<script src="js/shared/workflows.js"></script>
<script src="js/shared/learning-activity.js"></script>
<script src="js/shared/auth.js"></script>
<script src="js/data/growth-tasks.js"></script>
<script src="js/pages/spoc-learning.js"></script>
<script src="js/shared/states.js"></script>
<script src="js/shared/init.js"></script>
<script src="js/shared/topbar.js"></script>


</body></html>
